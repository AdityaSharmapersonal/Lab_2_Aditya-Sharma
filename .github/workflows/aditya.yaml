    - name: Action 1 - Run Script
      run: |
        echo "Creating and running script..."
        echo 'print("Aditya Sharma - Action 1 Complete!")' > aditya.py
        python aditya.py
        
    - name: Action 2 - Show info
      run: |
        echo "=== Aditya Sharma Info ==="
        pwd
        ls -la
        uname -a

